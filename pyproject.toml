[project]
name = "duration-humanizer"
version = "0.1.1"
description = "Converts a float of seconds into a compact human-readable string like '3h12m45s', omitting units that are zero."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
